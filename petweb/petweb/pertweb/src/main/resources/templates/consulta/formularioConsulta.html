<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Consulta — PetWeb</title>
  <link rel="stylesheet" href="/css/formulario.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <nav class="petweb-navbar">
    <div class="navbar-inner">

      <a href="/" class="navbar-brand">
        <img width="130" height="80" alt="Logo" src="https://i.pinimg.com/1200x/f8/f2/8a/f8f28a7e88a10a81cc3120822eaa8425.jpg">
        PetWeb
      </a>

      <button class="navbar-toggle"
              onclick="document.querySelector('.navbar-links').classList.toggle('open')"
              aria-label="Menu">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>

      <ul class="navbar-links">
        <li><a href="/">Início</a></li>
        <li><a href="/clientes/listar">Clientes</a></li>
        <li><a href="/animais/listar">Animais</a></li>
        <li><a href="/veterinarios/listar">Veterinários</a></li>
        <li><a href="/consultas/listar" class="active">Consultas</a></li>
      </ul>

    </div>
  </nav>

  <header class="page-header">
    <div class="page-header-inner">

      <a href="/consultas/listar" class="btn-back" title="Voltar">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </a>

      <div class="page-header-text">
        <h1>Cadastro de Consulta</h1>
        <p>Preencha os dados abaixo para registrar uma nova consulta</p>
      </div>

    </div>
  </header>

  <div class="form-wrapper">
    <div class="form-card">

      <form th:action="@{/consultas/salvar}" method="post" th:object="${consulta}">
        <input type="hidden" name="idConsulta" th:field="*{idConsulta}">

        <p class="form-section">Data e Hora</p>

        <div class="form-row">
          <div class="form-group">
            <label for="dataConsulta">Data</label>
            <input type="date" id="dataConsulta" th:field="*{dataConsulta}">
          </div>
          <div class="form-group">
            <label for="horaConsulta">Hora</label>
            <input type="time" id="horaConsulta" th:field="*{horaConsulta}">
          </div>
        </div>

        <p class="form-section">Profissional</p>

        <div class="form-group">
          <label for="idVeterinario">Veterinário</label>
          <select id="idVeterinario" th:field="*{veterinario}">
            <option value="" disabled selected>Selecione um Veterinário</option>
            <option th:each="veterinario : ${veterinarios}"
                    th:text="${veterinario.nomeVeterinario}"
                    th:value="${veterinario.idVeterinario}">
            </option>
          </select>
        </div>

        <p class="form-section">Animal</p>

        <div class="form-group">
          <label for="idAnimal">Animal</label>
          <select id="idAnimal" th:field="*{animal}">
            <option value="" disabled selected>Selecione o Animal</option>
            <option th:each="animal : ${animais}"
                    th:text="${animal.nomeAnimal}"
                    th:value="${animal.idAnimal}">
            </option>
          </select>
        </div>

        <p class="form-section">Informações Clínicas</p>

        <div class="form-row">
          <div class="form-group">
            <label for="valorConsulta">Valor (R$)</label>
            <input type="text" id="valorConsulta" th:field="*{valorConsulta}" placeholder="0,00">
          </div>
          <div class="form-group">
            <label for="diagnosticoConsulta">Diagnóstico</label>
            <input type="text" id="diagnosticoConsulta" th:field="*{diagnosticoConsulta}" placeholder="Ex: Otite, Dermatite...">
          </div>
        </div>

        <div class="form-group">
          <label for="tratamentoConsulta">Tratamento</label>
          <input type="text" id="tratamentoConsulta" th:field="*{tratamentoConsulta}" placeholder="Descreva o tratamento indicado">
        </div>

        <div class="form-group">
          <label for="obsConsulta">Observações</label>
          <textarea id="obsConsulta" th:field="*{obsConsulta}" placeholder="Anotações adicionais sobre a consulta..."></textarea>
        </div>

        <div class="form-actions">
          <a href="/consultas/listar" class="btn btn-secondary">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M5 13l4 4L19 7"/>
            </svg>
            Salvar Consulta
          </button>
        </div>

      </form>
    </div>
  </div>

</body>
</html>
