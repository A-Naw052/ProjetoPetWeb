<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — PetWeb</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="/css/listarProduto.css">
</head>
<body>

  <!-- ══ NAVBAR ══ -->
  <nav class="petweb-navbar">
    <div class="navbar-inner">

      <a href="/" class="navbar-brand">
        <img width="130" height="80" alt="Logo" src="https://i.pinimg.com/1200x/f8/f2/8a/f8f28a7e88a10a81cc3120822eaa8425.jpg">
        PetWeb
      </a>

      <button class="navbar-toggle"
              onclick="document.querySelector('.navbar-links').classList.toggle('open')"
              aria-label="Menu">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>

      <ul class="navbar-links">
        <li><a href="/home">Início</a></li>
        <li><a href="/clientes/listar">Clientes</a></li>
        <li><a href="/animais/listar">Animais</a></li>
        <li><a href="/veterinarios/listar">Veterinários</a></li>
        <li><a href="/consultas/listar">Consultas</a></li>
        <li><a href="/produtos/listar">Produto</a></li>
        <li><a href="/pedidos/listar" class="active">Pedido</a></li>
        <li><a href="/logout" class="navbar-logout">Sair</a></li>
      </ul>

    </div>
  </nav>

  <!-- PAGE HEADER -->
  <header class="page-header">
    <div class="page-header-inner">
      <div class="page-header-text">
        <h1>Pedidos</h1>
        <p>Visualize e gerencie os pedidos realizados</p>
      </div>
      <a th:href="@{/pedidos/criar}" class="btn-header-new">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Novo Pedido
      </a>
    </div>
  </header>

  <!-- CONTEÚDO: grid de pedidos -->
  <div class="produtos-shell">

    <!-- SIDEBAR -->
    <aside class="produtos-sidebar">
      <h6>Ordenar por</h6>
      <select id="ordenarPor" onchange="ordenarPedidos(this.value)">
        <option value="padrao">Padrão</option>
        <option value="recente">Mais recentes</option>
        <option value="antigo">Mais antigos</option>
        <option value="menor">Menor valor</option>
        <option value="maior">Maior valor</option>
      </select>
    </aside>

    <!-- GRID MAIN -->
    <main>
      <div class="produtos-toolbar">
        <span class="list-count" th:text="${#lists.isEmpty(pedidos)} ? 'Nenhum resultado' : ${#lists.size(pedidos)} + ' pedidos encontrados'">Resultados encontrados</span>
        <div class="search-box">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="Buscar por cliente ou ID..." oninput="filtrarGrid(this.value)">
        </div>
      </div>

      <div class="produtos-grid" id="produtosGrid">
        <div class="produto-card"
             th:each="pedido, iter : ${pedidos}"
             th:attr="data-id=${pedido.idPedido},
                      data-cliente=${pedido.cliente != null ? pedido.cliente.nomeCliente : 'Sem Cliente'},
                      data-data=${pedido.dataPedido},
                      data-valor=${pedido.totalPedido != null ? pedido.totalPedido : 0}">

          <div class="produto-thumb" th:classappend="'c' + ${iter.index % 5}">
            <span th:text="'#' + ${pedido.idPedido}">#1</span>
          </div>

          <div class="produto-info">
            <p class="produto-desc" th:text="${pedido.cliente != null ? pedido.cliente.nomeCliente : 'Cliente não informado'}"></p>
            <p class="produto-marca" th:text="'Data: ' + ${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy')}"></p>
            <p class="produto-valor" th:text="'R$ ' + ${#numbers.formatDecimal(pedido.totalPedido != null ? pedido.totalPedido : 0, 1, 2)}"></p>
          </div>

          <div class="produto-actions">
            <a th:href="@{/pedidos/detalhes/{id}(id=${pedido.idPedido})}" class="btn btn-secondary">
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              Detalhes
            </a>
            <a th:href="@{/pedidos/excluir/{id}(id=${pedido.idPedido})}" class="btn btn-danger"
               onclick="return confirm('Deseja cancelar/excluir este pedido?')">
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
              Excluir
            </a>
          </div>
        </div>

        <!-- Estado vazio -->
        <div class="produtos-empty" th:if="${#lists.isEmpty(pedidos)}">
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <p>Nenhum pedido cadastrado ainda.</p>
        </div>
      </div>

      <div class="produtos-footer">
        <span>* Registros atualizados</span>
        <a href="/" class="btn btn-secondary">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Voltar
        </a>
      </div>
    </main>

  </div>

  <script>
    function filtrarGrid(termo) {
      termo = termo.toLowerCase();
      document.querySelectorAll('#produtosGrid .produto-card').forEach(card => {
        const texto = card.innerText.toLowerCase();
        card.style.display = texto.includes(termo) ? '' : 'none';
      });
    }

    function ordenarPedidos(criterio) {
      const grid = document.getElementById('produtosGrid');
      const cards = Array.from(grid.querySelectorAll('.produto-card'));
      cards.sort((a, b) => {
        if (criterio === 'recente') return new Date(b.dataset.data) - new Date(a.dataset.data);
        if (criterio === 'antigo') return new Date(a.dataset.data) - new Date(b.dataset.data);
        if (criterio === 'menor') return parseFloat(a.dataset.valor) - parseFloat(b.dataset.valor);
        if (criterio === 'maior') return parseFloat(b.dataset.valor) - parseFloat(a.dataset.valor);
        return 0;
      });
      cards.forEach(card => grid.appendChild(card));
    }
  </script>
</body>
</html>
