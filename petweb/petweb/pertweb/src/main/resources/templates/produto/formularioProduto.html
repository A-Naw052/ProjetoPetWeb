<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produto — PetWeb</title>
  <link rel="stylesheet" href="/css/formulario.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- ══ NAVBAR ══ -->
  <nav class="petweb-navbar">
    <div class="navbar-inner">

      <a href="/" class="navbar-brand">
        <img width="130" height="80" alt="Logo" src="https://i.pinimg.com/1200x/f8/f2/8a/f8f28a7e88a10a81cc3120822eaa8425.jpg">
        PetWeb
      </a>

      <button class="navbar-toggle"
              onclick="document.querySelector('.navbar-links').classList.toggle('open')"
              aria-label="Menu">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>

      <ul class="navbar-links">
        <li><a href="/home" class="active">Início</a></li>
        <li><a href="/clientes/listar">Clientes</a></li>
        <li><a href="/animais/listar">Animais</a></li>
        <li><a href="/veterinarios/listar">Veterinários</a></li>
        <li><a href="/consultas/listar">Consultas</a></li>
        <li><a href="/produtos/listar">Produto</a></li>
        <li><a href="/pedidos/listar">Pedido</a></li>
        <li><a href="/logout" class="navbar-logout">Sair</a></li>
      </ul>

    </div>
  </nav>
  </nav>

  <header class="page-header">
    <div class="page-header-inner">
      <a href="/produtos/listar" class="btn-back" title="Voltar">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </a>
      <div class="page-header-text">
        <h1>Cadastro de Produto</h1>
        <p>Registre os dados do produto no catálogo</p>
      </div>
    </div>
  </header>

  <div class="form-wrapper">
    <div class="form-card">
      <form th:action="@{/produtos/salvar}" method="post" th:object="${produto}">
        <input type="hidden" th:field="*{idProduto}">

        <p class="form-section">Dados do Produto</p>

        <div class="form-group">
          <label for="descricaoProduto">Descrição *</label>
          <input type="text" id="descricaoProduto" th:field="*{descricaoProduto}" placeholder="Ex: Ração Premium 10kg">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="marcaProduto">Marca</label>
            <input type="text" id="marcaProduto" th:field="*{marcaProduto}" placeholder="Ex: PetFood">
          </div>
          <div class="form-group">
            <label for="unidadeProduto">Unidade</label>
            <input type="text" id="unidadeProduto" th:field="*{unidadeProduto}" placeholder="Ex: UN, KG, CX">
          </div>
        </div>

        <div class="form-group">
          <label for="valorProduto">Valor *</label>
          <input type="text" id="valorProduto" th:field="*{valorProduto}" placeholder="R$ 0,00">
        </div>

        <div class="form-actions">
          <a href="/produtos/listar" class="btn btn-secondary">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M5 13l4 4L19 7"/>
            </svg>
            Salvar Produto
          </button>
        </div>

      </form>
    </div>
  </div>

</body>
</html>
