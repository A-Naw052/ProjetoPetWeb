l<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Cliente — PetWeb</title>
  <link rel="stylesheet" href="/css/formulario.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- ══ NAVBAR ══ -->
  <nav class="petweb-navbar">
    <div class="navbar-inner">

      <a href="/" class="navbar-brand">
        <img width="130" height="80" alt="Logo" src="https://i.pinimg.com/1200x/f8/f2/8a/f8f28a7e88a10a81cc3120822eaa8425.jpg">
        PetWeb
      </a>

      <button class="navbar-toggle"
              onclick="document.querySelector('.navbar-links').classList.toggle('open')"
              aria-label="Menu">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>

      <ul class="navbar-links">
        <li><a href="/home" class="active">Início</a></li>
        <li><a href="/clientes/listar">Clientes</a></li>
        <li><a href="/animais/listar">Animais</a></li>
        <li><a href="/veterinarios/listar">Veterinários</a></li>
        <li><a href="/consultas/listar">Consultas</a></li>
        <li><a href="/produtos/listar">Produto</a></li>
        <li><a href="/pedidos/listar">Pedido</a></li>
        <li><a href="/logout" class="navbar-logout">Sair</a></li>
      </ul>

    </div>
  </nav>

  <header class="page-header">
    <div class="page-header-inner">
      <a href="/clientes/listar" class="btn-back" title="Voltar">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </a>
      <div class="page-header-text">
        <h1>Cadastro de Cliente</h1>
        <p>Registre os dados do tutor responsável pelo pet</p>
      </div>
    </div>
  </header>

  <div class="form-wrapper">
    <div class="form-card">
      <form th:action="@{/clientes/salvar}" method="post" th:object="${cliente}">
        <input type="hidden" th:field="*{idCliente}">

        <p class="form-section">Dados Pessoais</p>

        <div class="form-group">
          <label for="nomeCliente">Nome Completo *</label>
          <input type="text" id="nomeCliente" th:field="*{nomeCliente}" placeholder="Ex: Maria Silva">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpfCliente">CPF *</label>
            <input type="text" id="cpfCliente" th:field="*{cpfCliente}" placeholder="000.000.000-00">
          </div>
          <div class="form-group">
            <label for="telefoneCliente">Telefone</label>
            <input type="tel" id="telefoneCliente" th:field="*{telefoneCliente}" placeholder="(00) 90000-0000">
          </div>
        </div>

        <div class="form-group">
          <label for="emailCliente">E-mail</label>
          <input type="email" id="emailCliente" th:field="*{emailCliente}" placeholder="exemplo@email.com">
        </div>

        <div class="form-group">
          <label for="enderecoCliente">E-mail</label>
          <input type="text" id="enderecoCliente" th:field="*{enderecoCliente}" placeholder="Rua Amapa, 220">
        </div>

        <div class="form-actions">
          <a href="/clientes/listar" class="btn btn-secondary">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M5 13l4 4L19 7"/>
            </svg>
            Salvar Cadastro
          </button>
        </div>

      </form>
    </div>
  </div>

</body>
</html>
