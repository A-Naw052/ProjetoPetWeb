<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário — PetWeb</title>
  <link rel="stylesheet" href="/css/formulario.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  
  
  <nav class="petweb-navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand"></a>
        <img width="130" height="80" alt="Logo" src="https://i.pinimg.com/1200x/f8/f2/8a/f8f28a7e88a10a81cc3120822eaa8425.jpg">
        PetWeb
      </a>
      <button class="navbar-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <ul class="navbar-links">
        <li><a href="/home">Início</a></li>
        <li><a href="/clientes/listar">Clientes</a></li>
        <li><a href="/animais/listar">Animais</a></li>
        <li><a href="/veterinarios/listar">Veterinários</a></li>
        <li><a href="/consultas/listar">Consultas</a></li>
      </ul>
    </div>
  </nav>

  <header class="page-header">
    <div class="page-header-inner">
      <a href="/" class="btn-back" title="Voltar">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </a>
      <div class="page-header-text">
        <h1>Cadastro de Usuário</h1>
        <p>Crie um novo acesso ao sistema PetWeb</p>
      </div>
    </div>
  </header>

  <div class="form-wrapper">
    <div class="form-card">
      <form th:action="@{/usuarios/salvar}" method="post" th:object="${usuario}">
        <input type="hidden" th:field="*{idUsuario}">

        <p class="form-section">Dados Pessoais</p>

        <div class="form-group">
          <label for="nomeUsuario">Nome Completo *</label>
          <input type="text" id="nomeUsuario" th:field="*{nomeUsuario}" placeholder="Ex: João Souza">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpfUsuario">CPF *</label>
            <input type="text" id="cpfUsuario" th:field="*{cpfUsuario}" placeholder="000.000.000-00">
          </div>
          <div class="form-group">
            <label for="telefoneUsuario">Telefone</label>
            <input type="tel" id="telefoneUsuario" th:field="*{telefoneUsuario}" placeholder="(00) 90000-0000">
          </div>
        </div>

        <div class="form-group">
          <label for="emailUsuario">E-mail *</label>
          <input type="email" id="emailUsuario" th:field="*{emailUsuario}" placeholder="exemplo@email.com">
        </div>

        <p class="form-section">Acesso ao Sistema</p>

        <div class="form-row">
          <div class="form-group">
            <label for="loginUsuario">Login *</label>
            <input type="text" id="loginUsuario" th:field="*{loginUsuario}" placeholder="Seu nome de usuário">
          </div>
          <div class="form-group">
            <label for="senhaUsuario">Senha *</label>
            <input type="password" id="senhaUsuario" th:field="*{senhaUsuario}" placeholder="••••••••">
          </div>
        </div>

        <div class="form-actions">
          <a href="/" class="btn btn-secondary">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M5 13l4 4L19 7"/>
            </svg>
            Salvar Cadastro
          </button>
        </div>

      </form>
    </div>
  </div>

</body>
</html>
